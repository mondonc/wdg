<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Comfortaa, 'Trebuchet MS', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- opaque background: must stay readable on dark pages -->
  <rect x="0" y="0" width="980" height="620" fill="white"/>

  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Aujourd&#8217;hui, sans WDG — chaque accès est une boîte indépendante</text>

  <!-- ============ clients (left) ============ -->
  <rect x="40" y="180" width="150" height="64" rx="10" fill="#eef4ee" stroke="#59a14f" stroke-width="1.3"/>
  <text x="115" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d2b">Utilisateurs</text>
  <text x="115" y="226" text-anchor="middle" font-size="11" fill="#555">centres A et B</text>
  <text x="115" y="266" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">un client différent</text>
  <text x="115" y="282" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">par mode d&#8217;accès</text>

  <rect x="40" y="430" width="150" height="64" rx="10" fill="#fdf1e3" stroke="#f28e2b" stroke-width="1.3"/>
  <text x="115" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5416">Admins</text>
  <text x="115" y="476" text-anchor="middle" font-size="11" fill="#555">postes d&#8217;administration</text>

  <!-- ============ silo 1 : DGTW ============ -->
  <rect x="295" y="75" width="230" height="115" rx="12" fill="none" stroke="#bbb" stroke-width="1"/>
  <text x="410" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">Accès direct « DGTW »</text>
  <rect x="315" y="100" width="190" height="34" rx="8" fill="#e7f0e6" stroke="#59a14f"/>
  <text x="410" y="121" text-anchor="middle" font-size="11" fill="#222">Boîtier DGTW — centre A</text>
  <rect x="315" y="144" width="190" height="34" rx="8" fill="#e7f0e6" stroke="#59a14f"/>
  <text x="410" y="165" text-anchor="middle" font-size="11" fill="#222">Boîtier DGTW — centre B</text>

  <!-- ============ silo 2 : VPN ============ -->
  <rect x="295" y="225" width="230" height="115" rx="12" fill="none" stroke="#bbb" stroke-width="1"/>
  <text x="410" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">Concentrateurs VPN</text>
  <rect x="315" y="250" width="190" height="34" rx="8" fill="#e7f0e6" stroke="#59a14f"/>
  <text x="410" y="271" text-anchor="middle" font-size="11" fill="#222">VPN — centre A</text>
  <rect x="315" y="294" width="190" height="34" rx="8" fill="#e7f0e6" stroke="#59a14f"/>
  <text x="410" y="315" text-anchor="middle" font-size="11" fill="#222">VPN — centre B</text>

  <!-- ============ silo 3 : bastions ============ -->
  <rect x="295" y="395" width="230" height="115" rx="12" fill="none" stroke="#bbb" stroke-width="1"/>
  <text x="410" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">Bastions RDP (admin)</text>
  <rect x="315" y="420" width="190" height="34" rx="8" fill="#fdf1e3" stroke="#f28e2b"/>
  <text x="410" y="441" text-anchor="middle" font-size="11" fill="#222">Bastion — centre A</text>
  <rect x="315" y="464" width="190" height="34" rx="8" fill="#fdf1e3" stroke="#f28e2b"/>
  <text x="410" y="485" text-anchor="middle" font-size="11" fill="#222">Bastion — datacenter</text>

  <!-- ============ networks (right) ============ -->
  <rect x="720" y="85" width="225" height="44" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="832" y="111" text-anchor="middle" font-size="11" fill="#222">VLAN utilisateurs — centre A</text>

  <rect x="720" y="147" width="225" height="44" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="832" y="173" text-anchor="middle" font-size="11" fill="#222">VLAN utilisateurs — centre B</text>

  <text x="832" y="237" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">le même VLAN raccordé 4 fois</text>
  <rect x="720" y="245" width="225" height="50" rx="8" fill="#f4f4f4" stroke="#88171A" stroke-width="1.6"/>
  <text x="832" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">VLAN métier</text>
  <text x="832" y="283" text-anchor="middle" font-size="11" fill="#555">(applications partagées)</text>

  <rect x="720" y="415" width="225" height="44" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="832" y="441" text-anchor="middle" font-size="11" fill="#222">VLAN admin — centre A</text>

  <rect x="720" y="477" width="225" height="44" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="832" y="503" text-anchor="middle" font-size="11" fill="#222">VLAN admin — datacenter</text>

  <text x="832" y="548" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">chaque VLAN admin n&#8217;est joignable</text>
  <text x="832" y="564" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">que par son propre bastion</text>

  <!-- ============ client connections (dashed) ============ -->
  <g fill="none" stroke="#777" stroke-dasharray="4,4" marker-end="url(#ag)">
    <path d="M190,200 C240,195 248,117 311,117"/>
    <path d="M190,208 C245,206 252,161 311,161"/>
    <path d="M190,220 C240,224 250,267 311,267"/>
    <path d="M190,228 C240,242 250,311 311,311"/>
    <path d="M190,452 C240,448 250,437 311,437"/>
    <path d="M190,466 C240,470 250,481 311,481"/>
  </g>

  <!-- ============ network legs (solid) ============ -->
  <g fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#ad)">
    <path d="M505,112 C610,105 630,107 716,107"/>
    <path d="M505,122 C610,135 640,238 716,258"/>
    <path d="M505,158 C610,155 640,168 716,169"/>
    <path d="M505,166 C610,178 645,252 716,264"/>
    <path d="M505,262 C615,245 630,135 716,113"/>
    <path d="M505,270 C610,270 645,270 716,270"/>
    <path d="M505,306 C615,290 635,190 716,175"/>
    <path d="M505,314 C610,312 645,278 716,277"/>
    <path d="M505,437 C610,437 645,437 716,437"/>
    <path d="M505,481 C610,483 645,498 716,499"/>
  </g>

  <!-- ============ annotations ============ -->
  <text x="430" y="560" text-anchor="middle" font-size="11.5" font-style="italic" fill="#88171A">6 boîtiers indépendants, 3 technologies, 3 procédures côté poste de travail</text>
  <text x="430" y="578" text-anchor="middle" font-size="11.5" font-style="italic" fill="#88171A">une boîte en panne = son service est perdu, aucune autre ne peut la remplacer</text>

  <!-- ============ legend ============ -->
  <g font-size="10.5" fill="#555">
    <line x1="42" y1="596" x2="80" y2="596" stroke="#777" stroke-dasharray="4,4"/>
    <text x="88" y="600">connexion du poste client</text>
    <line x1="42" y1="612" x2="80" y2="612" stroke="#555" stroke-width="1.1"/>
    <text x="88" y="616">raccordement réseau de la boîte</text>
  </g>
</svg>
