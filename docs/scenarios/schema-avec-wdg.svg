<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Comfortaa, 'Trebuchet MS', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#88171A"/>
    </marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e15759"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- opaque background: must stay readable on dark pages -->
  <rect x="0" y="0" width="1000" height="660" fill="white"/>

  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Demain, avec WDG — une entrée unifiée, pilotée par un plan de contrôle</text>

  <!-- ============ control plane ============ -->
  <rect x="340" y="64" width="320" height="62" rx="10" fill="white" stroke="#88171A" stroke-width="2"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#88171A">Plan de contrôle WDG</text>
  <text x="500" y="110" text-anchor="middle" font-size="11" fill="#555">authentification (CAS) &#8594; droits par groupe</text>

  <text x="700" y="80" font-size="11" font-style="italic" fill="#88171A">tous les droits tiennent en 2 groupes :</text>
  <text x="700" y="96" font-size="11" font-style="italic" fill="#88171A">« utilisateurs » et « admins »</text>

  <!-- ============ client (left) ============ -->
  <rect x="40" y="290" width="175" height="78" rx="10" fill="#f4f4f4" stroke="#333" stroke-width="1.2"/>
  <text x="127" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Un seul client</text>
  <text x="127" y="334" text-anchor="middle" font-size="11" fill="#555">WireGuard standard</text>
  <text x="127" y="351" text-anchor="middle" font-size="11" fill="#555">utilisateurs comme admins</text>
  <text x="127" y="390" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">même client, même procédure</text>
  <text x="127" y="406" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">pour toutes les populations</text>

  <!-- ============ entry: users ============ -->
  <rect x="290" y="185" width="255" height="135" rx="12" fill="#f6faf5" stroke="#59a14f" stroke-width="1.3"/>
  <text x="417" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d7038">Entrée utilisateurs (wdg-users)</text>
  <rect x="310" y="218" width="215" height="34" rx="8" fill="white" stroke="#59a14f"/>
  <text x="417" y="239" text-anchor="middle" font-size="11" fill="#222">Passerelle — centre A</text>
  <rect x="310" y="266" width="215" height="34" rx="8" fill="white" stroke="#59a14f"/>
  <text x="417" y="287" text-anchor="middle" font-size="11" fill="#222">Passerelle — centre B</text>

  <text x="417" y="340" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">instances interchangeables : un centre tombe,</text>
  <text x="417" y="356" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">le client bascule sur l&#8217;autre à la connexion</text>

  <!-- ============ entry: admins ============ -->
  <rect x="290" y="410" width="255" height="135" rx="12" fill="#fdf8f1" stroke="#f28e2b" stroke-width="1.3"/>
  <text x="417" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#a8641a">Entrée admins (wdg-admins)</text>
  <rect x="310" y="443" width="215" height="34" rx="8" fill="white" stroke="#f28e2b"/>
  <text x="417" y="464" text-anchor="middle" font-size="11" fill="#222">Passerelle — centre A</text>
  <rect x="310" y="491" width="215" height="34" rx="8" fill="white" stroke="#f28e2b"/>
  <text x="417" y="512" text-anchor="middle" font-size="11" fill="#222">Passerelle — centre B</text>

  <!-- ============ relays (admin only) ============ -->
  <rect x="620" y="410" width="180" height="38" rx="8" fill="#edf2f8" stroke="#4e79a7" stroke-dasharray="5,3"/>
  <text x="710" y="433" text-anchor="middle" font-size="11" fill="#222">Relais admin — centre A</text>
  <rect x="620" y="460" width="180" height="38" rx="8" fill="#edf2f8" stroke="#4e79a7" stroke-dasharray="5,3"/>
  <text x="710" y="483" text-anchor="middle" font-size="11" fill="#222">Relais admin — centre B</text>
  <rect x="620" y="510" width="180" height="38" rx="8" fill="#edf2f8" stroke="#4e79a7" stroke-dasharray="5,3"/>
  <text x="710" y="533" text-anchor="middle" font-size="11" fill="#222">Relais admin — datacenter</text>

  <!-- ============ networks (right) ============ -->
  <rect x="825" y="185" width="160" height="40" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="905" y="209" text-anchor="middle" font-size="11" fill="#222">VLAN utilisateurs A</text>

  <rect x="825" y="240" width="160" height="40" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="905" y="264" text-anchor="middle" font-size="11" fill="#222">VLAN utilisateurs B</text>

  <rect x="825" y="300" width="160" height="48" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="905" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">VLAN métier</text>
  <text x="905" y="336" text-anchor="middle" font-size="10.5" fill="#555">(applications partagées)</text>

  <rect x="825" y="410" width="160" height="40" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="905" y="434" text-anchor="middle" font-size="11" fill="#222">VLAN admin A</text>

  <rect x="825" y="460" width="160" height="40" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="905" y="484" text-anchor="middle" font-size="11" fill="#222">VLAN admin B</text>

  <rect x="825" y="510" width="160" height="40" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="905" y="534" text-anchor="middle" font-size="11" fill="#222">VLAN admin DC</text>

  <!-- ============ control-plane arrows (dashed red) ============ -->
  <g fill="none" stroke="#88171A" stroke-width="1.1" stroke-dasharray="4,4" marker-end="url(#ar)">
    <path d="M340,112 C240,122 152,200 130,284"/>
    <path d="M450,126 C430,145 412,160 402,180"/>
    <path d="M550,126 C580,240 570,340 490,407"/>
    <path d="M660,100 C800,125 725,300 712,406"/>
  </g>

  <!-- ============ data plane: client tunnels ============ -->
  <g fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#ad)">
    <path d="M215,318 C245,305 260,275 286,257"/>
    <path d="M215,342 C245,360 258,430 286,460"/>
  </g>
  <text x="222" y="270" text-anchor="middle" font-size="10.5" fill="#444">tunnels chiffrés</text>
  <text x="222" y="284" text-anchor="middle" font-size="10.5" fill="#444">(WireGuard)</text>

  <!-- ============ data plane: network legs ============ -->
  <g fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#ad)">
    <path d="M525,232 C650,222 710,208 821,205"/>
    <path d="M525,241 C660,258 715,300 821,315"/>
    <path d="M525,280 C650,272 715,262 821,260"/>
    <path d="M525,289 C660,300 720,315 821,322"/>
    <path d="M525,452 C680,428 745,362 821,332"/>
    <path d="M525,500 C700,468 765,372 821,340"/>
  </g>

  <!-- ============ relay hops (red) ============ -->
  <g fill="none" stroke="#e15759" stroke-width="1.6" marker-end="url(#ae)">
    <path d="M525,462 C560,455 580,440 616,431"/>
    <path d="M525,470 C570,485 580,512 616,524"/>
    <path d="M525,506 C560,498 580,488 616,481"/>
    <path d="M525,514 C560,520 582,527 616,531"/>
  </g>
  <text x="568" y="444" text-anchor="middle" font-size="10" fill="#e15759">relais</text>

  <!-- ============ relays -> admin VLANs ============ -->
  <g fill="none" stroke="#666" stroke-width="1.1" marker-end="url(#an)">
    <path d="M800,429 L821,430"/>
    <path d="M800,479 L821,480"/>
    <path d="M800,529 L821,530"/>
  </g>

  <!-- ============ annotations ============ -->
  <text x="710" y="578" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">les VLANs admin ne terminent aucun tunnel client :</text>
  <text x="710" y="594" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">on n&#8217;y entre qu&#8217;en second saut, via une passerelle admin,</text>
  <text x="710" y="610" text-anchor="middle" font-size="11" font-style="italic" fill="#88171A">depuis n&#8217;importe quel centre d&#8217;entrée</text>

  <!-- ============ legend ============ -->
  <g font-size="10.5" fill="#555">
    <line x1="42" y1="592" x2="80" y2="592" stroke="#88171A" stroke-dasharray="4,4" stroke-width="1.1"/>
    <text x="88" y="596">plan de contrôle : distribution des configurations</text>
    <line x1="42" y1="612" x2="80" y2="612" stroke="#444" stroke-width="1.4"/>
    <text x="88" y="616">tunnel WireGuard / raccordement réseau</text>
    <line x1="42" y1="632" x2="80" y2="632" stroke="#e15759" stroke-width="1.6"/>
    <text x="88" y="636">second saut via relais (trafic admin)</text>
  </g>
</svg>
