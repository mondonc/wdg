    <path d="M140,590 C140,600 140,608 140,616"/>
    <path d="M320,590 C320,600 320,608 320,616"/>
    <path d="M450,458 C425,530 428,585 462,618"/>
    <path d="M530,590 C530,600 530,608 530,616"/>
    <path d="M710,590 C710,600 710,608 710,616"/>
    <path d="M840,432 C812,510 806,590 794,646"/>
