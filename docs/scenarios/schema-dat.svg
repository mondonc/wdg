    <path d="M310,462 L318,521"/>
    <path d="M540,462 L532,521"/>
    <path d="M700,462 L708,521"/>
    <path d="M930,462 L922,521"/>
    <path d="M1090,462 L1098,521"/>
    <path d="M385,445 C520,487 700,489 848,538"/>
  </g>
