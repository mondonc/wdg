    <circle cx="660" cy="722" r="9" fill="#888"/><text x="660" y="726" fill="white">8</text>
  </g>

  <!-- ============ flow key + legend ============ -->
  <g font-size="10.5" fill="#444">
    <text x="300" y="748">&#9312; API clients — TLS 1.3 hybride PQ, TCP/443</text>
    <text x="300" y="768">&#9313; SSO navigateur &#8594; CAS, TCP/443</text>
    <text x="300" y="788">&#9314; validation de ticket (serveur &#224; serveur)</text>
    <text x="640" y="748">&#9315; tunnels WireGuard clients — UDP/51820-51821</text>
    <text x="640" y="768">&#9316; second saut inter-passerelles — UDP/51820</text>
    <text x="640" y="788">&#9317; sync des agents — pull 5 s, sortant uniquement</text>
    <text x="980" y="748">&#9318; PostgreSQL — TCP/5432</text>
    <text x="980" y="768">&#9319; admin Django (interne)</text>
    <text x="980" y="788">&#9320; les relais sortent dans leur VLAN (NAT)</text>
  </g>
  <g font-size="10.5" fill="#555">
    <line x1="300" y1="812" x2="336" y2="812" stroke="#444" stroke-width="1.3"/>
    <text x="344" y="816">flux clients / données</text>
    <line x1="520" y1="812" x2="556" y2="812" stroke="#e15759" stroke-width="1.5"/>
    <text x="564" y="816">WireGuard inter-passerelles</text>
    <line x1="790" y1="812" x2="826" y2="812" stroke="#88171A" stroke-width="1.1" stroke-dasharray="4,4"/>
    <text x="834" y="816">sync / plan de contrôle (sortant)</text>
    <line x1="1080" y1="812" x2="1116" y2="812" stroke="#888" stroke-width="1"/>
    <text x="1124" y="816">flux de support</text>
  </g>
