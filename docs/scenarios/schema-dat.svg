  <!-- 2: browser -> CAS -->
  <path d="M275,82 C500,50 800,52 996,90" fill="none" stroke="#888" stroke-width="1" marker-end="url(#ag)"/>
  <!-- 3: external planes -> CAS -->
  <g fill="none" stroke="#888" stroke-width="1" marker-end="url(#ag)">
    <path d="M590,196 C780,155 900,135 996,116"/>
    <path d="M900,208 C950,185 990,160 1024,144"/>
  </g>
  <!-- 4: clients -> wdgw (UDP) -->
