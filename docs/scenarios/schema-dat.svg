  <!-- ============ flows ============ -->
  <!-- 1: clients -> external planes (443) -->
  <g fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ad)">
    <path d="M280,105 C305,110 308,190 326,222"/>
    <path d="M280,122 C430,135 530,150 656,178"/>
