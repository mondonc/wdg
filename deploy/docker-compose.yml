name: wdg

# The HA layout of docs/DAT.md, scaled down to one compose file: two external
# and two internal control-plane instances share one PostgreSQL. The DNS
# aliases `cp-ext` / `cp-int` are carried by both members of each pair —
# Docker's DNS answers with both IPs (round-robin), standing in for the
# DNS round-robin / VIP of the real deployment. Exactly one container (the
# one-shot `migrate` service) applies the schema; instances only wait for it.

x-cp-env: &cp-env
  WDG_SECRET_KEY: dev-insecure-change-me
  WDG_DEBUG: "1"
  WDG_ALLOWED_HOSTS: "*"
  POSTGRES_HOST: postgres
  # CAS reachable from BOTH the browser (tester, in-network) and the
  # control plane, so a single URL works for login + serviceValidate.
  WDG_CAS_BASE_URL: http://cas-test:8080
  # The CAS service root: the alias, so the callback lands on either external
  # instance (the one-time code lives in the shared database).
  WDG_PUBLIC_BASE_URL: http://cp-ext:8000
  WDG_CAS_GROUP_ATTRIBUTES: memberOf,eduPersonAffiliation

x-control-plane: &control-plane
  build: ../server
  volumes:
    - ../server:/app
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
    interval: 3s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wdg
      POSTGRES_USER: wdg
      POSTGRES_PASSWORD: wdg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wdg"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  cas-test:
    build: ./cas-test
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: waits for PostgreSQL, applies migrations, exits. The plane
  # instances start after it so none of them races on the schema.
  migrate:
    build: ../server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *cp-env
    volumes:
      - ../server:/app
    command: ["python", "-c", "print('schema ready')"]

  # --- external plane (clients): two instances behind the cp-ext alias ------

  control-plane-ext-1:
    <<: *control-plane
    depends_on:
      migrate:
        condition: service_completed_successfully
      cas-test:
        condition: service_started
    environment:
      <<: *cp-env
      WDG_PLANES: external
      WDG_MIGRATE: "0"
    networks:
      default:
        aliases: [cp-ext]

  control-plane-ext-2:
    <<: *control-plane
    depends_on:
      migrate:
        condition: service_completed_successfully
      cas-test:
        condition: service_started
    environment:
      <<: *cp-env
      WDG_PLANES: external
      WDG_MIGRATE: "0"
    networks:
      default:
        aliases: [cp-ext]

  # --- internal plane (admin + gateway sync): two instances, cp-int alias ---

  control-plane-int-1:
    <<: *control-plane
    depends_on:
      migrate:
        condition: service_completed_successfully
      cas-test:
        condition: service_started
    environment:
      <<: *cp-env
      WDG_PLANES: internal
      WDG_MIGRATE: "0"
    ports:
      - "8000:8000"   # Django admin from the host
    networks:
      default:
        aliases: [cp-int]

  control-plane-int-2:
    <<: *control-plane
    depends_on:
      migrate:
        condition: service_completed_successfully
      cas-test:
        condition: service_started
    environment:
      <<: *cp-env
      WDG_PLANES: internal
      WDG_MIGRATE: "0"
    networks:
      default:
        aliases: [cp-int]

  # Post-quantum TLS terminator in front of the external plane (M5).
  # OpenSSL 3.5+ offers X25519MLKEM768; classic clients still fall back.
  # cp-ext resolves to both external instances: implicit round-robin upstream.
  nginx-pq:
    build: ./nginx-pq
    depends_on:
      control-plane-ext-1:
        condition: service_healthy
      control-plane-ext-2:
        condition: service_healthy
    environment:
      UPSTREAM: cp-ext:8000
      # "on" makes sensitive endpoints refuse non-PQ connections (fail-closed).
      REQUIRE_PQ: "${REQUIRE_PQ:-off}"
      # Trusted LB CIDR(s), comma-separated: recover the client IP from
      # X-Forwarded-For (empty = direct clients, header not trusted).
      REAL_IP_FROM: "${REAL_IP_FROM:-}"
    ports:
      - "8443:443"

  # On-demand integration test runner (does not start with `up`).
  # Reuses the control-plane image (already has Python + requests).
  tester:
    build: ../server
    profiles: ["test"]
    depends_on:
      control-plane-ext-1:
        condition: service_healthy
      control-plane-ext-2:
        condition: service_healthy
    environment:
      CONTROL_PLANE: http://cp-ext:8000
      CAS: http://cas-test:8080
    volumes:
      - ./tests:/tests
    entrypoint: []
    command: ["python", "/tests/run_all.py"]

  # --- M3 tunnel topology (profile "tunnel", not started by default) --------

  # A service sitting on the protected "exit" network, reachable only through
  # the gateway once the tunnel is up.
  exit-target:
    image: python:3.13-slim
    profiles: ["tunnel"]
    command: ["python", "-m", "http.server", "8000"]
    networks:
      exitnet:
        ipv4_address: 10.0.0.10

  # A second protected network (net-lab-a), served by gw-a but granted only to
  # some groups — used to prove group-scoped egress enforcement.
  exit-target-b:
    image: python:3.13-slim
    profiles: ["tunnel"]
    command: ["python", "-m", "http.server", "8000"]
    networks:
      exitnet-b:
        ipv4_address: 192.168.20.10

  gw-a:
    build: ../gateway
    profiles: ["tunnel"]
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      control-plane-int-1:
        condition: service_healthy
      control-plane-int-2:
        condition: service_healthy
    environment:
      # Both internal instances: the agent sticks to one, fails over to the
      # other (deliberately explicit URLs, to exercise the agent-side failover
      # rather than Docker's DNS round-robin).
      WDG_CONTROL_PLANE: http://control-plane-int-1:8000,http://control-plane-int-2:8000
      WDG_GATEWAY_TOKEN: gw-a-sync-secret
    volumes:
      # Persistent WireGuard key: the gateway keeps its identity across restarts.
      - gwa-state:/var/lib/wdg
    networks:
      default: {}
      exitnet: {}
      exitnet-b: {}

  # Site-b instance of the "gw-a" service: same legs and relay link as gw-a.
  # Clients prefer gw-a (their site) and fail over here when it is down.
  gw-a2:
    build: ../gateway
    profiles: ["tunnel"]
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      control-plane-int-1:
        condition: service_healthy
      control-plane-int-2:
        condition: service_healthy
    environment:
      WDG_CONTROL_PLANE: http://control-plane-int-1:8000,http://control-plane-int-2:8000
      WDG_GATEWAY_TOKEN: gw-a2-sync-secret
    volumes:
      - gwa2-state:/var/lib/wdg
    networks:
      default: {}
      exitnet: {}
      exitnet-b: {}

  # Single instance of the gw-b service (net-common + net-lab-b legs).
  gw-b:
    build: ../gateway
    profiles: ["tunnel"]
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      control-plane-int-1:
        condition: service_healthy
      control-plane-int-2:
        condition: service_healthy
    environment:
      WDG_CONTROL_PLANE: http://control-plane-int-1:8000,http://control-plane-int-2:8000
      WDG_GATEWAY_TOKEN: gw-b-sync-secret
    volumes:
      - gwb-state:/var/lib/wdg
    networks:
      default: {}
      exitnet: {}
      exitnet-lab-b: {}

  # Lab B's service: reachable only through the gw-b tunnel (second
  # simultaneous tunnel of the multi-tunnel client).
  exit-target-lab-b:
    image: python:3.13-slim
    profiles: ["tunnel"]
    command: ["python", "-m", "http.server", "8000"]
    networks:
      exitnet-lab-b:
        ipv4_address: 192.168.30.10

  # Relay-only gateway (service dc-access): no direct clients, reached through
  # gw-a over an inter-gateway WireGuard link. Its only leg is the DC network.
  gw-dc:
    build: ../gateway
    profiles: ["tunnel"]
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      control-plane-int-1:
        condition: service_healthy
      control-plane-int-2:
        condition: service_healthy
    environment:
      WDG_CONTROL_PLANE: http://control-plane-int-1:8000,http://control-plane-int-2:8000
      WDG_GATEWAY_TOKEN: gw-dc-sync-secret
    volumes:
      - gwdc-state:/var/lib/wdg
    networks:
      default: {}
      exitnet-dc: {}

  # A service on the DC network: reachable only through the gw-a → gw-dc chain.
  exit-target-dc:
    image: python:3.13-slim
    profiles: ["tunnel"]
    command: ["python", "-m", "http.server", "8000"]
    networks:
      exitnet-dc:
        ipv4_address: 192.168.40.10

  # On-demand: runs the full client flow and probes the exit target through
  # a real WireGuard tunnel to gw-a. `docker compose run --rm client-probe`.
  client-probe:
    build:
      # Repo-root context: the probe drives the real wg_client code.
      context: ..
      dockerfile: deploy/client-probe/Dockerfile
    profiles: ["tunnel"]
    cap_add:
      - NET_ADMIN
    depends_on:
      control-plane-ext-1:
        condition: service_healthy
      control-plane-ext-2:
        condition: service_healthy
    environment:
      CONTROL_PLANE: http://cp-ext:8000
      USERNAME: alice
      TARGET_URL: http://10.0.0.10:8000
    networks:
      default: {}

networks:
  default: {}
  exitnet:
    ipam:
      config:
        - subnet: 10.0.0.0/24
  exitnet-b:
    ipam:
      config:
        - subnet: 192.168.20.0/24
  exitnet-dc:
    ipam:
      config:
        - subnet: 192.168.40.0/24
  exitnet-lab-b:
    ipam:
      config:
        - subnet: 192.168.30.0/24

volumes:
  pgdata:
  gwa-state:
  gwa2-state:
  gwb-state:
  gwdc-state:
